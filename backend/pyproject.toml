[project]
name = "worldlens-ai"
version = "0.1.0"
description = "Personal world intelligence assistant — AI-powered daily news analysis and briefing"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
