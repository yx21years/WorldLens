                - heading "Why Offload?" [level=2] [ref=f75e148]
                - paragraph [ref=f75e149]: Every new visitor downloads your heavy assets from Framer and it counts against your bandwidth. Offload moves those assets to its own infrastructure so your Framer meter barely moves. Real users see 90% less bandwidth usage after switching.
                - paragraph [ref=f75e150]:
                  - strong [ref=f75e151]: Trusted by 300+ Framer builders. 2 TB+ of bandwidth saved every month.
                - paragraph [ref=f75e152]:
                  - link "🌐 Learn more" [ref=f75e153] [cursor=pointer]:
                    - /url: https://offload.framercoder.com
              - figure "Reduce Framer bandwidth once and for all" [ref=f75e154]:
                - img "YouTube video thumbnail for YouTube video player" [ref=f75e443] [cursor=pointer]
                - button "Play" [ref=f75e155] [cursor=pointer]
              - generic [ref=f75e160]:
                - heading "How It Works" [level=3] [ref=f75e161]
                - paragraph [ref=f75e162]: No technical setup. No workflow changes. Upload from your computer, pick assets from the canvas, offload CMS collections, or scan any live URL to find your heaviest files. Everything runs inside Framer. Drag, drop, optimize, insert, done.
                - heading "Key Features" [level=3] [ref=f75e163]
                - list [ref=f75e164]:
                  - listitem [ref=f75e165]:
                    - paragraph [ref=f75e166]: Auto WebP Conversion — JPEG and PNG files auto-convert to WebP on upload. 50–90% smaller files, zero extra work.
                  - listitem [ref=f75e167]:
                    - paragraph [ref=f75e168]: Responsive Image Optimization — Auto-generates tablet (1200px) and mobile (720px) variants with srcSet support. Visitors always download the right-sized file.
                  - listitem [ref=f75e169]:
                    - paragraph [ref=f75e170]: In-Framer Video Compression — Compress videos directly in Framer. Pick resolution (480p–2880p), adjust quality, strip audio, generate poster frames. No server upload needed.
                  - listitem [ref=f75e171]:
                    - paragraph [ref=f75e172]: CMS Offloading — Offload images and videos from entire Framer CMS collections in bulk. Auto-creates organized folders per collection with full WebP and responsive variant support.
                  - listitem [ref=f75e173]:
                    - paragraph [ref=f75e174]: Site URL Scanner — Paste any live Framer site URL to detect and rank heavy assets by size and bandwidth impact. One-click offload per asset with estimated savings.
                  - listitem [ref=f75e175]:
                    - paragraph [ref=f75e176]: Folders & Asset Management — Search, sort, drag between folders, batch upload, bulk delete. Your complete media library inside Framer.
                  - listitem [ref=f75e177]:
                    - paragraph [ref=f75e178]: Canvas & Batch Upload — Select one or more assets on the Framer canvas and offload in one click, or drop files from your computer onto any folder.
                  - listitem [ref=f75e179]:
                    - paragraph [ref=f75e180]: One-Click Insertion — Insert optimized assets (including tablet and mobile variants) straight back into your Framer canvas.
                  - listitem [ref=f75e181]:
                    - paragraph [ref=f75e182]: Bandwidth Savings Calculator — See real-time cost savings and track usage across projects.
                  - listitem [ref=f75e183]:
                    - paragraph [ref=f75e184]: Global CDN Delivery — Fast worldwide load times via Cloudflare's edge network.
                - heading "Who Is Offload For?" [level=3] [ref=f75e185]
                - paragraph [ref=f75e186]: Framer designers hitting bandwidth limits. Agencies managing multiple client sites with heavy video content. Solo creators building image-rich portfolios. Anyone getting bandwidth overage emails from Framer or trying to avoid upgrading to a higher Framer plan.
                - paragraph [ref=f75e187]: Offload scales from a single freelance site to a full agency workflow.
                - heading "Pricing" [level=3] [ref=f75e188]
                - paragraph [ref=f75e189]: All plans include unlimited bandwidth. You only pay for storage.
                - list [ref=f75e190]:
                  - listitem [ref=f75e191]:
                    - paragraph [ref=f75e192]: Starter (Free) — 250MB storage, 25 assets, 1 project
                  - listitem [ref=f75e193]:
                    - paragraph [ref=f75e194]: Creator — 5GB storage, unlimited assets, 10 projects
                  - listitem [ref=f75e195]:
                    - paragraph [ref=f75e196]: Studio — 50GB storage, unlimited assets, unlimited projects
                  - listitem [ref=f75e197]:
                    - paragraph [ref=f75e198]: Agency — 200GB storage, unlimited assets, unlimited projects
                - paragraph [ref=f75e199]: Start free and upgrade anytime.
