          - heading "Frequently asked questions" [level=2] [ref=f36e2090]
          - generic [ref=f36e2091]:
            - generic [ref=f36e2092]:
              - heading "What is an AI website builder?" [level=3] [ref=f36e2094]
              - paragraph [ref=f36e2096]: An AI website builder uses AI to help create website structure, copy, visuals, and design direction from a prompt or an existing project. In Framer, AI works with editable website layers, so you can refine the result on the canvas, adjust responsive layouts, manage content, and publish a finished site.
            - generic [ref=f36e2097]:
              - heading "Can I edit a website created with AI in Framer?" [level=3] [ref=f36e2099]
              - paragraph [ref=f36e2101]: Yes. Framer creates editable website layers rather than a fixed generated image or locked template. You can update layout, typography, components, styles, breakpoints, effects, copy, images, and CMS content directly in Framer while AI helps with the work.
            - generic [ref=f36e2102]:
              - heading "Can I publish and manage an AI-built website with Framer?" [level=3] [ref=f36e2104]
              - paragraph [ref=f36e2106]: Yes. Framer combines AI-assisted creation with CMS content management, branching and review workflows, hosting, SEO settings, redirects, analytics, and publishing. Teams can create or update a site with AI, review the work, and publish approved changes from the same platform.
