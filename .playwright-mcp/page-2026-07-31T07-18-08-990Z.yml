              - heading "✦ Not Ordinary Scroll Reveal" [level=2] [ref=f96e133]
              - paragraph [ref=f96e134]: Most scroll text reveal components require you to enter text in the control panel, which breaks your ability to apply global text styles in Framer.
              - paragraph [ref=f96e135]:
                - strong [ref=f96e136]: Text Reveal Scroll
                - text: works differently..
              - paragraph [ref=f96e137]: Instead of replacing the native text layer, it works directly with your existing text. This preserves all styles applied from the global assets panel, ensuring your font size, weight, color, letter spacing, and line height remain exactly as designed.
              - paragraph [ref=f96e138]: You keep full control over your typography, while the component adds a smooth, cinematic scroll-driven text animation on top.
              - heading "Instructions" [level=2] [ref=f96e139]
              - list [ref=f96e140]:
                - listitem [ref=f96e141]:
                  - paragraph [ref=f96e142]:
                    - text: Add this component to the canvas on the
                    - strong [ref=f96e143]: desktop breakpoint
                    - text: .
                - listitem [ref=f96e144]:
                  - paragraph [ref=f96e145]:
                    - text: Place a
                    - strong [ref=f96e146]: Text layer outside the desktop breakpoint
                    - text: .
                - listitem [ref=f96e147]:
                  - paragraph [ref=f96e148]:
                    - strong [ref=f96e149]: Wrap the Text layer in a Stack.
                - listitem [ref=f96e150]:
                  - paragraph [ref=f96e151]:
                    - text: Set the Text layer's
                    - strong [ref=f96e152]: width to "Fill"
                    - text: so it will be responsive across screens.
                - listitem [ref=f96e153]:
                  - paragraph [ref=f96e154]:
                    - text: In the component's property panel, use the
                    - strong [ref=f96e155]: "\"Text\" property control"
                    - text: to connect that Text layer.
              - heading "Setup" [level=3] [ref=f96e156]
              - list [ref=f96e157]:
                - listitem [ref=f96e158]:
                  - paragraph [ref=f96e159]: You can configure the component settings from the right-side control panel.
                - listitem [ref=f96e160]:
                  - paragraph [ref=f96e161]: The animation works in Preview and live site (not inside canvas)
              - heading "Properties Control" [level=2] [ref=f96e162]
              - figure "Scroll Text Reveal Framer Component Controls" [ref=f96e163]:
                - img "Scroll Text Reveal Framer Component Controls" [ref=f96e164]
              - heading "How It Works" [level=2] [ref=f96e166]
              - list [ref=f96e167]:
                - listitem [ref=f96e168]:
                  - paragraph [ref=f96e169]:
                    - strong [ref=f96e170]: "Start %:"
                    - text: Defines where the reveal begins in the viewport.
                - listitem [ref=f96e171]:
                  - paragraph [ref=f96e172]:
                    - strong [ref=f96e173]: "End %:"
                    - text: Defines where the reveal completes
                - listitem [ref=f96e174]:
                  - paragraph [ref=f96e175]:
                    - strong [ref=f96e176]: "Dim Opacity:"
                    - text: Controls opacity of unrevealed text (subtle ghost → fully hidden)
                - listitem [ref=f96e177]:
                  - paragraph [ref=f96e178]:
                    - strong [ref=f96e179]: "Reveal By:"
                    - text: "Choose between:"
                  - list [ref=f96e180]:
                    - listitem [ref=f96e181]:
                      - paragraph [ref=f96e182]:
                        - strong [ref=f96e183]: Characters
                        - text: → letter by letter reveal
                    - listitem [ref=f96e184]:
                      - paragraph [ref=f96e185]:
                        - strong [ref=f96e186]: Words
                        - text: → smoother word-by-word animation
                - listitem [ref=f96e187]:
                  - paragraph [ref=f96e188]:
                    - strong [ref=f96e189]: Font Size
                    - text: ": Toggle between Global (uses the connected Text layer's style) or Custom (set a fixed px size)."
              - heading "Key Features" [level=2] [ref=f96e190]
              - list [ref=f96e191]:
                - listitem [ref=f96e192]:
                  - paragraph [ref=f96e193]:
                    - strong [ref=f96e194]: "Style-safe text splitting:"
                    - text: Preserves all Framer typography styles.
                - listitem [ref=f96e195]:
                  - paragraph [ref=f96e196]:
                    - strong [ref=f96e197]: "Scroll-driven reveal:"
                    - text: True scroll-driven text animation.
                - listitem [ref=f96e198]:
                  - paragraph [ref=f96e199]:
                    - strong [ref=f96e200]: "Smooth progressive animation:"
