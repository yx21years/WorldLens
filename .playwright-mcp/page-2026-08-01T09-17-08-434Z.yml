    - generic [ref=e11]: "# 今日全球简报 ## 地缘政治与冲突 **欧洲移民危机升级**：西班牙北非休达地区遭遇大规模移民潮，约6万名摩洛哥移民涌入西班牙飞地，造成至少18人死亡。西班牙已派遣军队应对，意大利则暂停与西班牙的申根区自由流动协议。这一事件凸显了欧洲与非洲之间持续的移民挑战，可能考验欧盟在边境管理方面的合作。 **俄乌冲突持续**：乌克兰总统泽连斯基报告，一枚俄罗斯导弹袭击了克里维里赫附近的一个村庄，造成一个家庭的5名成员死亡，包括一名6岁女孩和两名男孩。此外，波兰总理称在靠近乌克兰边境地区发现的导弹很可能是俄罗斯发射的，这标志着俄乌冲突可能升级，并涉及北约领土。 **中东局势紧张**：美国与伊朗之间的紧张关系加剧，前总统特朗普威胁对伊朗发动军事打击，而伊朗官员声称已制定应对计划。沙特阿拉伯面临战略抉择，是在美伊冲突中保持威慑姿态还是尝试缓和紧张局势。与此同时，哈马斯解除武装的计划提供了加沙地区罕见的希望，尽管面临重大障碍，国际社会对此反应谨慎乐观。 ..."
