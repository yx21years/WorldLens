        - list [ref=f57e271]:
          - listitem [ref=f57e273]:
            - generic [ref=f57e274]:
              - heading "Do I need to set up a Framer MCP server?" [level=3] [ref=f57e276]
              - paragraph [ref=f57e278]:
                - text: No. Framer doesn’t require a separate MCP server. If you’re searching for a Framer MCP, the native Framer External Agent connection gives
                - link "Claude Code" [ref=f57e279] [cursor=pointer]:
                  - /url: https://www.anthropic.com/claude-code
                - text: ","
                - link "Cursor" [ref=f57e280] [cursor=pointer]:
                  - /url: https://cursor.com/
                - text: ","
                - link "Codex" [ref=f57e281] [cursor=pointer]:
                  - /url: https://openai.com/codex/
                - text: ","
                - link "Antigravity CLI" [ref=f57e282] [cursor=pointer]:
                  - /url: https://antigravity.google/
                - text: ", and other AI tools direct access to your canvas, components, CMS, and project context, without manual MCP setup."
          - listitem [ref=f57e284]:
            - generic [ref=f57e285]:
              - heading "Which AI agents are supported?" [level=3] [ref=f57e287]
              - paragraph [ref=f57e289]:
                - text: Framer Agent works with any AI that can run a terminal command or call an MCP tool, including
                - link "Claude Code" [ref=f57e290] [cursor=pointer]:
                  - /url: https://www.anthropic.com/claude-code
                - text: ","
                - link "Codex" [ref=f57e291] [cursor=pointer]:
                  - /url: https://openai.com/codex/
                - text: ","
                - link "Cursor" [ref=f57e292] [cursor=pointer]:
                  - /url: https://cursor.com/
                - text: ","
                - link "Antigravity CLI" [ref=f57e293] [cursor=pointer]:
                  - /url: https://antigravity.google/
                - text: ", and"
                - link "Windsurf" [ref=f57e294] [cursor=pointer]:
                  - /url: https://windsurf.com/
                - text: . If your agent supports tools or a terminal, it can connect.
          - listitem [ref=f57e296]:
            - generic [ref=f57e297]:
              - heading "Can the agent edit my live site?" [level=3] [ref=f57e299]
              - paragraph [ref=f57e301]: No. The agent works on your canvas in the Framer editor, not on your published site. Changes only go live when you choose to publish them yourself or tell the agent.
          - listitem [ref=f57e303]:
            - generic [ref=f57e304]:
              - heading "Does the agent have access to my CMS?" [level=3] [ref=f57e306]
              - paragraph [ref=f57e308]: Yes. Once connected, the agent can read and write CMS collections, including creating, updating, and deleting items. You stay in control of what gets published.
          - listitem [ref=f57e310]:
            - generic [ref=f57e311]:
              - heading "Is it safe to give an agent access to my project?" [level=3] [ref=f57e313]
              - paragraph [ref=f57e315]: The agent only has access to the projects you explicitly connect it to. It cannot access other projects, your account settings, or billing. You can revoke access at any time.
          - listitem [ref=f57e317]:
            - generic [ref=f57e318]:
              - heading "What happens if the agent makes a mistake?" [level=3] [ref=f57e320]
              - paragraph [ref=f57e322]:
                - text: Framer has
                - link "branching" [ref=f57e323] [cursor=pointer]:
                  - /url: ../../collaborate/
                - text: ", so every change made by an external agent automatically happens on a branch. You can undo changes, review the branch, and decide when to merge it back into your main branch."
          - listitem [ref=f57e325]:
            - generic [ref=f57e326]:
              - heading "What should I do when my AI asks me to choose a folder to work from?" [level=3] [ref=f57e328]
              - paragraph [ref=f57e330]: External Agents running on your machine need a folder to work from. They use it to save temporary files that make working with your Framer project more efficient. You can choose any folder in any location, such as your Desktop or Documents.
